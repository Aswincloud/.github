name: Org security sweep

# Weekly check that every repo has secret scanning + push protection on,
# and that there are no unresolved secret-scanning alerts. Opens (or updates)
# a tracking issue in this repo if anything needs attention.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC — off the hour on purpose
  workflow_dispatch: {}      # allow manual runs

permissions:
  contents: read
  issues: write   # the built-in token manages the tracking issue in this repo

concurrency:
  group: security-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      ORG: Aswincloud
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # Short-lived (1 h) aswincloud-bot App token for the org-wide READS
      # (secret-scanning settings and alerts need admin-level access). It
      # replaces ORG_SECURITY_TOKEN, a personal token revoked on 2026-11-11.
      # The tracking issue in this repo is managed with the built-in
      # GITHUB_TOKEN instead, so the App needs no Issues permission.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: read
          permission-metadata: read
          permission-secret-scanning-alerts: read

      - name: Run sweep
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "## 🔒 Org security sweep — $(date -u '+%Y-%m-%d %H:%M UTC')" > report.md
          echo "" >> report.md

          problems=0

          # Public, non-archived repos: scanning + push protection must be on.
          mapfile -t repos < <(gh api "orgs/$ORG/repos?per_page=100&type=public" --paginate \
            --jq '.[] | select(.archived==false) | .name' | sort)

          echo "### Public repositories checked: ${#repos[@]}" >> report.md
          echo "" >> report.md

          scan_off=()
          push_off=()
          open_alerts=()

          for r in "${repos[@]}"; do
            s=$(gh api "repos/$ORG/$r" --jq '.security_and_analysis.secret_scanning.status // "unknown"' 2>/dev/null || echo unknown)
            p=$(gh api "repos/$ORG/$r" --jq '.security_and_analysis.secret_scanning_push_protection.status // "unknown"' 2>/dev/null || echo unknown)
            [ "$s" != "enabled" ] && scan_off+=("$r ($s)")
            [ "$p" != "enabled" ] && push_off+=("$r ($p)")

            if [ "$s" = "enabled" ]; then
              n=$(gh api "repos/$ORG/$r/secret-scanning/alerts?state=open" --jq 'length' 2>/dev/null || echo 0)
              if [ "${n:-0}" -gt 0 ]; then
                open_alerts+=("**$r**: $n open alert(s) — https://github.com/$ORG/$r/security/secret-scanning")
              fi
            fi
          done

          emit () {  # $1 = heading, rest = array items
            local heading="$1"; shift
            if [ "$#" -gt 0 ]; then
              problems=$((problems+1))
              echo "### ⚠️ $heading" >> report.md
              for i in "$@"; do echo "- $i" >> report.md; done
              echo "" >> report.md
            fi
          }

          # "${arr[@]}" (bash >= 4.4) expands an empty array to zero words even
          # under set -u. The old "${arr[@]:-}" produced one empty word, so every
          # section was reported with a blank bullet when nothing was wrong.
          emit "Secret scanning OFF"    "${scan_off[@]}"
          emit "Push protection OFF"    "${push_off[@]}"
          emit "Open secret alerts"     "${open_alerts[@]}"

          if [ "$problems" -eq 0 ]; then
            echo "✅ All public repos have secret scanning + push protection on, and no open alerts." >> report.md
          fi

          cat report.md

          TITLE="🔒 Org security sweep — action needed"
          existing=$(GH_TOKEN="$ISSUE_TOKEN" gh issue list --repo "$ORG/.github" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ "$problems" -gt 0 ]; then
            if [ -n "$existing" ]; then
              GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$existing" --repo "$ORG/.github" --body-file report.md
            else
              GH_TOKEN="$ISSUE_TOKEN" gh issue create --repo "$ORG/.github" --title "$TITLE" \
                --body-file report.md --label security 2>/dev/null \
              || GH_TOKEN="$ISSUE_TOKEN" gh issue create --repo "$ORG/.github" --title "$TITLE" --body-file report.md
            fi
            echo "::warning::Security sweep found $problems category(ies) needing attention."
          else
            # All clear — close any stale open issue.
            if [ -n "$existing" ]; then
              GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$existing" --repo "$ORG/.github" --body "✅ Latest sweep is clean — closing." || true
              GH_TOKEN="$ISSUE_TOKEN" gh issue close "$existing" --repo "$ORG/.github" || true
            fi
            echo "All clear."
          fi
