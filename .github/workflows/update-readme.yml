name: Update README

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token (PR author + push identity)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout (authed with app token so we can push a branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Regenerate README
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/update_readme.py

      - name: Open PR + approve + auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}       # App = PR author
          APPROVE_TOKEN: ${{ secrets.WRITE_ACCESS_PAT }} # real user = approver
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md profile/README.md; then
            echo "README already up to date — nothing to do."
            exit 0
          fi

          BRANCH="chore/update-readme-${GITHUB_RUN_ID}"
          git config user.name  "aswincloud-bot[bot]"
          git config user.email "aswincloud-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md profile/README.md
          git commit -m "chore: auto-update public repository list"
          # origin is already authed with the app token via checkout above.
          git push origin "$BRANCH"

          PR_URL="$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "chore: auto-update public repository list" \
            --body "Automated README refresh. Opened by the scheduled Update README workflow; approved and set to auto-merge.")"
          echo "Opened $PR_URL"
          PR_NUM="${PR_URL##*/}"

          # Approve as a DIFFERENT real write-user so it counts toward required
          # review + code-owner review (the App can't approve, nor its own PR).
          GH_TOKEN="${APPROVE_TOKEN}" gh pr review "$PR_NUM" --repo "$REPO" --approve \
            --body "Auto-approved: automated README update."

          gh pr merge "$PR_NUM" --repo "$REPO" --squash --auto --delete-branch
          echo "Auto-merge enabled on PR #${PR_NUM}."
