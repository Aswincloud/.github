name: Update README

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Mint app token (PR author + push identity)
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout (authed with app token so we can push a branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Regenerate README
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/update_readme.py

      - name: Commit README refresh straight to main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md profile/README.md; then
            echo "README already up to date — nothing to do."
            exit 0
          fi
          # Guard: the App may bypass main's rulesets on this repo (see
          # reconcile_rulesets.py README_APP_ID and the hand-made "main"
          # ruleset), so refuse to push anything beyond the two README files.
          changed="$(git status --porcelain | awk '{print $2}' | sort -u)"
          unexpected="$(printf '%s\n' "$changed" | grep -vxE 'README\.md|profile/README\.md' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Refusing to push: unexpected changes outside the README files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git config user.name  "aswincloud-bot[bot]"
          git config user.email "aswincloud-bot[bot]@users.noreply.github.com"
          git add README.md profile/README.md
          git commit -m "chore: auto-update public repository list"
          # origin is already authed with the 1-hour App token via checkout above.
          # A concurrent push to main makes this fail; the next daily run retries.
          git push origin HEAD:main
          echo "Pushed README refresh to main."
