name: Reconcile org baseline rulesets

# Weekly self-healing enforcement of TWO branch rulesets across every PUBLIC,
# active repo in the org:
#
#   org-baseline          Force-push/deletion block, PR required, thread
#                         resolution, and the MERGE QUEUE. Org admins keep a
#                         break-glass bypass so a bad required check or a jammed
#                         queue can't permanently lock a repo.
#   org-codeowner-review  1 approval + code-owner review, with @<org>/admins on
#                         the bypass list in mode "exempt".
#
# The bypass MODE is load-bearing. "always" and "pull_request" let the actor
# OVERRIDE the rule at merge time: GitHub then offers "merge without waiting for
# requirements", which merges directly and SKIPS THE QUEUE, and the green
# "Merge when ready" never appears. "exempt" instead makes the rule NOT
# APPLICABLE to the actor, so their PR reads CLEAN and takes the normal queued
# path. Verified on live PRs: always -> BLOCKED, pull_request -> BLOCKED,
# exempt -> CLEAN with zero approvals. Do not change it.
#
# The approval/code-owner rules live ONLY in the bypassable ruleset on purpose:
# rules aggregate to the most restrictive value across all matching rulesets, so
# duplicating them into org-baseline would silently cancel the bypass out.
#
# Still STACKS with any richer per-repo ruleset — GitHub applies all matching
# rulesets, so this only adds a floor and never removes a repo's own rules.
#
# Auth: the Aswincloud Bot App. For enforce mode the App must hold
# `administration: write` (grant it at
# https://github.com/settings/apps/aswincloud-bot/permissions then approve the
# install update). Until then, enforce runs go RED with a clear
# 'needs App administration:write' note per repo instead of silently no-op'ing.
#
# Scheduled runs ENFORCE. Manual (workflow_dispatch) runs default to DRY-RUN so
# a click can't rewrite 17 repos by accident — flip the input to enforce on demand.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (true) or apply changes (false)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: reconcile-rulesets
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint app token (org-wide)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Reconcile
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ORG: ${{ github.repository_owner }}
          # schedule => enforce; manual => whatever the input says (default true).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python3 .github/reconcile_rulesets.py
