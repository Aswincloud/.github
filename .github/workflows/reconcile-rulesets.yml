name: Reconcile org baseline rulesets

# Weekly self-healing enforcement of a floor-level branch ruleset ('org-baseline')
# across every PUBLIC, active repo in the org. It STACKS with any richer per-repo
# ruleset (merge queue, CODEOWNERS) — GitHub applies all matching rulesets, so
# this only adds a floor and never removes rules. Proven on blog.
#
# Auth: the Aswincloud Bot App. For enforce mode the App must hold
# `administration: write` (grant it at
# https://github.com/settings/apps/aswincloud-bot/permissions then approve the
# install update). Until then, enforce runs go RED with a clear
# 'needs App administration:write' note per repo instead of silently no-op'ing.
#
# Scheduled runs ENFORCE. Manual (workflow_dispatch) runs default to DRY-RUN so
# a click can't rewrite 17 repos by accident — flip the input to enforce on demand.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (true) or apply changes (false)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: reconcile-rulesets
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint app token (org-wide)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Reconcile
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ORG: ${{ github.repository_owner }}
          # schedule => enforce; manual => whatever the input says (default true).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python3 .github/reconcile_rulesets.py
